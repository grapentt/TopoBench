# @package _global_

# ogbg-molpcba: Transform DAG demo with topological lifting
# Safe for testing on memory-constrained machines (uses mock dataset)

defaults:
  - override /dataset: graph/ogbg_molpcba
  - override /model: simplicial/scn
  - override /trainer: cpu

experiment_name: ogbg_molpcba_dag
seed: 42

task_name: multilabel_graph_classification

# Dataset configuration
dataset:
  loader:
    parameters:
      use_mock: true  # Use mock data for quick testing
      subset_size: 100
      split: train

# Update evaluator for multi-label classification (128 binary tasks)
evaluator:
  task: multilabel classification  # Critical: use multilabel not classification
  num_classes: 128
  metrics:
    - accuracy
    - f1_macro  # Better for imbalanced multilabel tasks

# Loss function for multi-label classification
loss:
  dataset_loss:
    task: multilabel classification
    loss_type: BCE  # BCEWithLogitsLoss for multilabel

# Use transforms directly for small dataset
transforms:
  clique_lifting:
    transform_type: lifting
    transform_name: SimplicialCliqueLifting
    complex_dim: 2
  projection:
    transform_type: feature
    transform_name: ProjectionSum

# Model configuration
model:
  feature_encoder:
    in_channels: [9, 9, 9]  # Node features for each dimension
    out_channels: 32
  backbone:
    in_channels_0: 32
    in_channels_1: 32
    in_channels_2: 32
  readout:
    hidden_dim: 32
    out_channels: 128

# Training
trainer:
  max_epochs: 1  # Just verify pipeline works
  check_val_every_n_epoch: 1  # Validate every epoch
  
data:
  batch_size: 16  # Small batch for testing

# Callbacks for monitoring training
callbacks:
  model_checkpoint:
    monitor: val/f1_macro  # Monitor F1-macro (best for imbalanced multilabel)
    mode: max
  early_stopping:
    monitor: val/f1_macro
    mode: max
    patience: 10
